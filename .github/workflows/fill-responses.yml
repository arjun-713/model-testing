name: Qwen responses with Gemma DeepEval judge

"on":
  pull_request:
    branches:
      - qwen-gemma-tr1
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      question_count:
        description: Number of questions to generate and evaluate
        required: false
        default: "50"

permissions:
  contents: read

concurrency:
  group: qwen-gemma-tr1-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      question_count: ${{ steps.plan.outputs.question_count }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      include_reason: ${{ steps.plan.outputs.include_reason }}
      judge_max_tokens: ${{ steps.plan.outputs.judge_max_tokens }}
      metric_threshold: ${{ steps.plan.outputs.metric_threshold }}
      minimum_coverage: ${{ steps.plan.outputs.minimum_coverage }}
      minimum_pass_rate: ${{ steps.plan.outputs.minimum_pass_rate }}
      deepeval_max_concurrent: ${{ steps.plan.outputs.deepeval_max_concurrent }}
    steps:
      - uses: actions/checkout@v4

      - name: Build shard matrix
        id: plan
        shell: bash
        run: |
          requested='${{ inputs.question_count }}'
          if [[ -z "$requested" ]]; then
            requested=$(jq -r '.question_count' configs/evaluation.json)
          fi
          shard_size=$(jq -r '.shard_size' configs/evaluation.json)
          python scripts/build_shard_matrix.py \
            --dataset dataset/responses.json \
            --question-count "$requested" \
            --shard-size "$shard_size" \
            --github-output "$GITHUB_OUTPUT"
          echo "include_reason=$(jq -r '.include_reason' configs/evaluation.json)" >> "$GITHUB_OUTPUT"
          echo "judge_max_tokens=$(jq -r '.judge_max_tokens' configs/evaluation.json)" >> "$GITHUB_OUTPUT"
          echo "metric_threshold=$(jq -r '.metric_threshold' configs/evaluation.json)" >> "$GITHUB_OUTPUT"
          echo "minimum_coverage=$(jq -r '.minimum_metric_coverage' configs/evaluation.json)" >> "$GITHUB_OUTPUT"
          echo "minimum_pass_rate=$(jq -r '.minimum_metric_pass_rate' configs/evaluation.json)" >> "$GITHUB_OUTPUT"
          echo "deepeval_max_concurrent=$(jq -r '.deepeval_max_concurrent' configs/evaluation.json)" >> "$GITHUB_OUTPUT"

  tests:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-eval.txt
      - run: python -m pip install -r requirements-eval.txt
      - run: python -m unittest discover -s tests -v

  prepare-model-cache:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-24.04
    env:
      RESPONSE_MODEL: qwen3:4b-instruct
      JUDGE_MODEL: gemma3:4b-it-qat
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - name: Restore prepared Ollama model cache
        id: restore-models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-${{ runner.os }}-qwen3-4b-instruct-gemma3-4b-it-qat-v3

      - name: Install Ollama on cache miss
        if: steps.restore-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh

      - name: Start Ollama on cache miss
        if: steps.restore-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo systemctl stop ollama 2>/dev/null || true
          sudo pkill -x ollama 2>/dev/null || true
          mkdir -p "$OLLAMA_MODELS"
          nohup ollama serve > /tmp/ollama-cache-builder.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ollama-cache-builder.log
          exit 1

      - name: Pull quantized models once
        if: steps.restore-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ollama pull "$RESPONSE_MODEL"
          ollama pull "$JUDGE_MODEL"

      - name: Verify models are in the cache directory
        if: steps.restore-models.outputs.cache-hit != 'true'
        shell: bash
        run: |
          test -d "$OLLAMA_MODELS/manifests"
          test -d "$OLLAMA_MODELS/blobs"
          du -sh "$OLLAMA_MODELS"

      - name: Save prepared Ollama model cache
        if: steps.restore-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-${{ runner.os }}-qwen3-4b-instruct-gemma3-4b-it-qat-v3

  generate-and-evaluate:
    needs: [prepare, tests, prepare-model-cache]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RESULTS_DIR: results/shard-${{ matrix.shard }}
      RESPONSE_MODEL: qwen3:4b-instruct
      JUDGE_MODEL: gemma3:4b-it-qat
      OLLAMA_MODELS: /home/runner/.ollama/models
      OLLAMA_NUM_PARALLEL: ${{ needs.prepare.outputs.deepeval_max_concurrent }}
      DEEPEVAL_MAX_CONCURRENT: ${{ needs.prepare.outputs.deepeval_max_concurrent }}
      CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
      DEEPEVAL_DISABLE_DOTENV: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
      DEEPEVAL_PER_TASK_TIMEOUT_SECONDS_OVERRIDE: "900"
      DEEPEVAL_JUDGE_NUM_CTX: "16384"
      DEEPEVAL_JUDGE_NUM_PREDICT: ${{ needs.prepare.outputs.judge_max_tokens }}
      INCLUDE_REASON: ${{ needs.prepare.outputs.include_reason }}
      METRIC_THRESHOLD: ${{ needs.prepare.outputs.metric_threshold }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-eval.txt

      - name: Initialize shard logs
        shell: bash
        run: |
          mkdir -p "$RESULTS_DIR"
          jq -n \
            --argjson shard '${{ matrix.shard }}' \
            --argjson offset '${{ matrix.offset }}' \
            --argjson limit '${{ matrix.limit }}' \
            --arg response_model "$RESPONSE_MODEL" \
            --arg judge_model "$JUDGE_MODEL" \
            '{shard: $shard, offset: $offset, limit: $limit, response_model: $response_model, judge_model: $judge_model}' \
            > "$RESULTS_DIR/shard.json"

      - name: Install DeepEval
        run: |
          python -m pip install -r requirements-eval.txt \
            2>&1 | tee "$RESULTS_DIR/dependency-install.log"

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh \
            2>&1 | tee "$RESULTS_DIR/ollama-install.log"

      - name: Restore prepared quantized Ollama models
        id: restore-models
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OLLAMA_MODELS }}
          key: ollama-${{ runner.os }}-qwen3-4b-instruct-gemma3-4b-it-qat-v3
          fail-on-cache-miss: true

      - name: Start Ollama
        shell: bash
        run: |
          sudo systemctl stop ollama 2>/dev/null || true
          sudo pkill -x ollama 2>/dev/null || true
          nohup ollama serve > "$RESULTS_DIR/ollama-server.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become ready within 60 seconds." >&2
          exit 1

      - name: Verify cached response and judge models
        shell: bash
        run: |
          started=$(date +%s)
          ollama pull "$RESPONSE_MODEL" \
            2>&1 | tee "$RESULTS_DIR/response-model-pull.log"
          response_completed=$(date +%s)
          ollama pull "$JUDGE_MODEL" \
            2>&1 | tee "$RESULTS_DIR/judge-model-pull.log"
          judge_completed=$(date +%s)
          jq -n \
            --arg response_model "$RESPONSE_MODEL" \
            --arg judge_model "$JUDGE_MODEL" \
            --argjson response_seconds "$((response_completed - started))" \
            --argjson judge_seconds "$((judge_completed - response_completed))" \
            '{response_model: $response_model, judge_model: $judge_model, response_pull_seconds: $response_seconds, judge_pull_seconds: $judge_seconds}' \
            > "$RESULTS_DIR/model-pull-timing.json"

      - name: Generate shard responses
        id: generation
        continue-on-error: true
        shell: bash
        run: |
          python runners/run_responses.py \
            --model "$RESPONSE_MODEL" \
            --model-name qwen \
            --input dataset/responses.json \
            --output-dir "$RESULTS_DIR" \
            --offset '${{ matrix.offset }}' \
            --limit '${{ matrix.limit }}' \
            --max-tokens 256 \
            --temperature 0.1 \
            --num-ctx 16384 \
            2>&1 | tee "$RESULTS_DIR/response-generation-console.log"

      - name: Validate shard responses
        id: validation
        if: always()
        continue-on-error: true
        run: |
          python runners/validate_responses.py \
            "$RESULTS_DIR/responses.json" \
            --expected-count '${{ matrix.limit }}' \
            2>&1 | tee "$RESULTS_DIR/response-validation.log"

      - name: Evaluate shard immediately with Gemma
        id: evaluation
        if: steps.validation.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          reason_flag="--no-include-reason"
          if [[ "$INCLUDE_REASON" == "true" ]]; then
            reason_flag="--include-reason"
          fi
          python -m evals.run_evaluation \
            --responses "$RESULTS_DIR/responses.json" \
            --goldens dataset/golden_dataset.json \
            --output-dir "$RESULTS_DIR" \
            --response-model "$RESPONSE_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --expected-count '${{ matrix.limit }}' \
            --threshold "$METRIC_THRESHOLD" \
            --max-concurrent "$DEEPEVAL_MAX_CONCURRENT" \
            "$reason_flag" \
            --identifier "qwen-gemma-tr1-${{ github.run_id }}-shard-${{ matrix.shard }}" \
            2>&1 | tee "$RESULTS_DIR/deepeval-console.log"

      - name: Retry only missing metric scores
        id: retry
        if: always() && steps.validation.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          reason_flag="--no-include-reason"
          if [[ "$INCLUDE_REASON" == "true" ]]; then
            reason_flag="--include-reason"
          fi
          python -m evals.retry_missing \
            --summary "$RESULTS_DIR/evaluation-summary.json" \
            --responses "$RESULTS_DIR/responses.json" \
            --goldens dataset/golden_dataset.json \
            --output "$RESULTS_DIR/retry-summary.json" \
            --response-model "$RESPONSE_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --threshold "$METRIC_THRESHOLD" \
            "$reason_flag" \
            2>&1 | tee "$RESULTS_DIR/retry-console.log"

      - name: Upload shard responses, metrics, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: ${{ env.RESULTS_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete shard
        if: always()
        env:
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
          RETRY_OUTCOME: ${{ steps.retry.outcome }}
        run: |
          if [[ "$GENERATION_OUTCOME" != "success" || "$VALIDATION_OUTCOME" != "success" || "$RETRY_OUTCOME" != "success" ]]; then
            echo "Shard generation, validation, or targeted retry failed." >&2
            exit 1
          fi
          if [[ ! -f "$RESULTS_DIR/evaluation-summary.json" ]]; then
            echo "The shard did not produce an evaluation summary." >&2
            exit 1
          fi

  aggregate:
    if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'eval'))
    needs: [prepare, generate-and-evaluate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all completed shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: artifacts

      - name: Aggregate responses and metric scores
        id: aggregate
        continue-on-error: true
        run: |
          python -m evals.aggregate_results \
            --artifact-dir artifacts \
            --dataset dataset/responses.json \
            --question-count '${{ needs.prepare.outputs.question_count }}' \
            --expected-shards '${{ needs.prepare.outputs.shard_count }}' \
            --metric-threshold '${{ needs.prepare.outputs.metric_threshold }}' \
            --minimum-coverage '${{ needs.prepare.outputs.minimum_coverage }}' \
            --minimum-pass-rate '${{ needs.prepare.outputs.minimum_pass_rate }}' \
            --output-dir aggregate

      - name: Publish aggregate report
        if: always()
        run: |
          if [[ -f aggregate/evaluation-report.md ]]; then
            cat aggregate/evaluation-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-gemma-tr1-report-${{ github.run_id }}
          path: aggregate/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce successful aggregation
        if: always()
        env:
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
        run: |
          if [[ "$AGGREGATE_OUTCOME" != "success" ]]; then
            echo "The final aggregate report is incomplete." >&2
            exit 1
          fi
