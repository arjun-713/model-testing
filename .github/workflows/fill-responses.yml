name: Generate and judge responses

"on":
  pull_request:
    branches:
      - qwen
      - gemma
      - phi

permissions:
  contents: read

concurrency:
  group: generate-judge-${{ github.event.pull_request.number }}-${{ github.base_ref }}
  cancel-in-progress: true

jobs:
  generate-and-judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MODEL_BRANCH: ${{ github.base_ref }}
      RESULTS_DIR: results/${{ github.base_ref }}
      JUDGE_MODEL: qwen3:4b-instruct
      CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
      DEEPEVAL_DISABLE_DOTENV: "1"
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-eval.txt

      - name: Resolve response model
        id: model
        shell: bash
        run: |
          mkdir -p "$RESULTS_DIR"
          model=$(jq -r --arg branch "$MODEL_BRANCH" '.[$branch].ollama_model // empty' configs/models.json)
          display_name=$(jq -r --arg branch "$MODEL_BRANCH" '.[$branch].display_name // empty' configs/models.json)
          if [[ -z "$model" || -z "$display_name" ]]; then
            echo "No model is configured for branch: $MODEL_BRANCH" >&2
            exit 1
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "display_name=$display_name" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg branch "$MODEL_BRANCH" \
            --arg model "$model" \
            --arg display_name "$display_name" \
            --arg judge_model "$JUDGE_MODEL" \
            '{branch: $branch, response_model: $model, display_name: $display_name, judge_model: $judge_model}' \
            > "$RESULTS_DIR/models.json"

      - name: Install DeepEval
        run: |
          python -m pip install -r requirements-eval.txt \
            2>&1 | tee "$RESULTS_DIR/dependency-install.log"

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v \
            2>&1 | tee "$RESULTS_DIR/unit-tests.log"

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh
          sh /tmp/install-ollama.sh \
            2>&1 | tee "$RESULTS_DIR/ollama-install.log"

      - name: Start Ollama
        shell: bash
        run: |
          nohup ollama serve > "$RESULTS_DIR/ollama-server.log" 2>&1 &
          echo $! > "$RESULTS_DIR/ollama-server.pid"
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become ready within 60 seconds." >&2
          exit 1

      - name: Pull response model
        shell: bash
        run: |
          started=$(date +%s)
          ollama pull '${{ steps.model.outputs.model }}' \
            2>&1 | tee "$RESULTS_DIR/response-model-pull.log"
          completed=$(date +%s)
          jq -n \
            --arg model '${{ steps.model.outputs.model }}' \
            --argjson duration_seconds "$((completed - started))" \
            '{model: $model, duration_seconds: $duration_seconds}' \
            > "$RESULTS_DIR/response-model-pull-timing.json"

      - name: Fill 10 actual_output fields
        id: generation
        continue-on-error: true
        shell: bash
        run: |
          python runners/run_responses.py \
            --model '${{ steps.model.outputs.model }}' \
            --model-name "$MODEL_BRANCH" \
            --input dataset/responses.json \
            --output-dir "$RESULTS_DIR" \
            --limit 10 \
            --max-tokens 256 \
            --temperature 0.1 \
            --num-ctx 16384 \
            2>&1 | tee "$RESULTS_DIR/response-generation-console.log"

      - name: Validate generated responses
        id: response_validation
        if: always()
        continue-on-error: true
        run: |
          python runners/validate_responses.py \
            "$RESULTS_DIR/responses.json" \
            --expected-count 10 \
            2>&1 | tee "$RESULTS_DIR/response-validation.log"

      - name: Pull Qwen judge model
        if: steps.response_validation.outcome == 'success'
        shell: bash
        run: |
          started=$(date +%s)
          ollama pull "$JUDGE_MODEL" \
            2>&1 | tee "$RESULTS_DIR/judge-model-pull.log"
          completed=$(date +%s)
          jq -n \
            --arg model "$JUDGE_MODEL" \
            --argjson duration_seconds "$((completed - started))" \
            '{model: $model, duration_seconds: $duration_seconds}' \
            > "$RESULTS_DIR/judge-model-pull-timing.json"

      - name: Evaluate with DeepEval
        id: evaluation
        if: steps.response_validation.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python evals/run_evaluation.py \
            --responses "$RESULTS_DIR/responses.json" \
            --goldens dataset/golden_dataset.json \
            --output-dir "$RESULTS_DIR" \
            --response-model "$MODEL_BRANCH" \
            --judge-model "$JUDGE_MODEL" \
            --expected-count 10 \
            --threshold 0.5 \
            --identifier "$MODEL_BRANCH-qwen-judge-pr-${{ github.event.pull_request.number }}" \
            2>&1 | tee "$RESULTS_DIR/deepeval-console.log"

      - name: Add evaluation report to workflow summary
        if: always()
        run: |
          if [[ -f "$RESULTS_DIR/evaluation-report.md" ]]; then
            cat "$RESULTS_DIR/evaluation-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload responses, metrics, and all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-${{ github.base_ref }}-${{ github.run_id }}
          path: ${{ env.RESULTS_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce complete generation and evaluation
        if: always()
        env:
          GENERATION_OUTCOME: ${{ steps.generation.outcome }}
          RESPONSE_VALIDATION_OUTCOME: ${{ steps.response_validation.outcome }}
          EVALUATION_OUTCOME: ${{ steps.evaluation.outcome }}
        run: |
          if [[ "$GENERATION_OUTCOME" != "success" || "$RESPONSE_VALIDATION_OUTCOME" != "success" || "$EVALUATION_OUTCOME" != "success" ]]; then
            echo "Response generation, validation, or DeepEval judging failed." >&2
            exit 1
          fi
